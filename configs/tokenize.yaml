---
# Tokenization config — reuses the same data module configs as training.
#
# Usage:
#   pixi run python scripts/tokenize.py \
#       ckpt_path=/path/to/vqvae/best.ckpt \
#       output_dir=results/tokenized/model_name \
#       datamodule.data_path=/path/to/file.h5
#
# All feature lists, preprocessing transforms, pT cuts, etc. come from the
# shared datamodule config (atlas_iterable.yaml) — no duplication.
defaults:
  - hydra: default
  - datamodule: atlas_iterable
  - _self_

# Required (set via CLI)
ckpt_path: ???
output_dir: ???

# Positions-out models only: the PositionTokenizer used in training (export fails if it doesn't match
# datamodule.position_features being set)
pos_tokenizer: null

# Override data module for full-file tokenization:
#   - No train/val split — everything goes to predict (via test_dataloader)
#   - Sequential order (seed=null) so output matches h5 row order
#   - Large batch/chunk sizes for throughput (predict needs no gradients)
datamodule:
  train_frac: 0.0
  val_frac: 0.0
  test_frac: 1.0
  seed: null
  batch_size: 2048
  chunk_size: 50000

# Trainer (minimal — just GPU setup and progress bar)
trainer:
  _target_: lightning.Trainer
  accelerator: auto
  devices: 1
  enable_progress_bar: true

# Needed by hydra/default.yaml's run.dir interpolation
full_path: ${output_dir}
